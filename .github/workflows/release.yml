name: Release

# Publishes to PyPI and creates a GitHub release when a version tag (such as v1.0.0) is pushed.
# Publishing uses PyPI's trusted publishing, which needs this repository and workflow registered as
# a trusted publisher of the project on PyPI, with the environment "pypi".
on:
    push:
        tags: ['v*']

permissions:
    contents: write
    id-token: write

jobs:
    release:
        runs-on: ubuntu-latest
        environment: pypi
        steps:
            -   uses: actions/checkout@v4

            -   uses: actions/setup-python@v5
                with:
                    python-version: "3.13"

            -   name: Check that the tag matches the package version
                run: test "v$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")" = "${GITHUB_REF_NAME}"

            -   name: Tests
                run: |
                    pip install torch --index-url https://download.pytorch.org/whl/cpu
                    pip install -e .
                    python -m unittest discover -s src -p "*_test.py" -t src

            -   name: Build
                run: pip install build && python -m build

            -   name: Publish to PyPI
                uses: pypa/gh-action-pypi-publish@release/v1

            # The notes are the section of the changelog for this version.
            -   name: Create the GitHub release
                run: |
                    awk -v version="${GITHUB_REF_NAME#v}" '
                        /^## / { found = $2 == version; next }
                        found { print }
                    ' CHANGELOG.md > release-notes.md
                    test -s release-notes.md
                    gh release create "${GITHUB_REF_NAME}" --title "torchtransform ${GITHUB_REF_NAME}" --notes-file release-notes.md dist/*
                env:
                    GH_TOKEN: ${{ github.token }}
